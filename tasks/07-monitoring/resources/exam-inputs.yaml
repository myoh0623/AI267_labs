apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: monitoring-mlserver
  namespace: ex267-t07-monitoring
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: EX267 Provided Monitoring MLServer
    opendatahub.io/runtime-version: "1.7.1"
spec:
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhoai/odh-mlserver-rhel9@sha256:bd44dd4fbe7b623b236232ca2c6c18e0394f23b8fdcd2cd6260c2d842345e49b
      command: [/bin/sh, -c]
      args:
        - |-
          mkdir -p /tmp/mlserver-models
          cp /mnt/models/model.joblib /tmp/mlserver-models/model.joblib
          printf '%s\n' '{"name":"{{.Name}}","implementation":"mlserver_sklearn.SKLearnModel","parameters":{"uri":"/tmp/mlserver-models/model.joblib"}}' > /tmp/mlserver-models/model-settings.json
          exec mlserver start /tmp/mlserver-models
      env:
        - {name: MLSERVER_MODEL_NAME, value: "{{.Name}}"}
        - {name: MLSERVER_HTTP_PORT, value: "8080"}
      ports:
        - {containerPort: 8080, protocol: TCP}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        runAsNonRoot: true
  multiModel: false
  protocolVersions: [v2]
  supportedModelFormats:
    - {name: sklearn, version: "1", autoSelect: true}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: iris-monitor
  namespace: ex267-t07-monitoring
  labels:
    opendatahub.io/dashboard: "true"
    ex267.practice/input: "true"
  annotations:
    openshift.io/display-name: EX267 Provided Iris Monitoring Source
    serving.kserve.io/deploymentMode: RawDeployment
    security.opendatahub.io/enable-auth: "false"
spec:
  predictor:
    minReplicas: 1
    model:
      modelFormat: {name: sklearn, version: "1"}
      name: ""
      runtime: monitoring-mlserver
      storageUri: gs://kfserving-examples/models/sklearn/1.0/model
      resources:
        requests: {cpu: 200m, memory: 512Mi}
        limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Pod
metadata:
  name: trustyai-test-client
  namespace: ex267-t07-monitoring
  labels:
    ex267.practice/input: "true"
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: registry.access.redhat.com/ubi9/ubi-minimal:9.6
      command: [/bin/sh, -c, sleep infinity]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 128Mi}
