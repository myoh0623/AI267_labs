apiVersion: trustyai.opendatahub.io/v1
kind: TrustyAIService
metadata:
  name: trustyai-service
  namespace: ex267-t07-monitoring
  labels:
    opendatahub.io/dashboard: "true"
spec:
  replicas: 1
  storage:
    format: PVC
    folder: /inputs
    size: 1Gi
  data:
    filename: data.csv
    format: CSV
  metrics:
    schedule: 5s
    batchSize: 5000

