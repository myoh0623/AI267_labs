apiVersion: v1
kind: Namespace
metadata:
  name: ex267-t08-evaluation
  labels:
    ex267.practice/managed: "true"
    ex267.practice/task: "08"
    opendatahub.io/dashboard: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quantization-results
  namespace: ex267-t08-evaluation
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantization-script
  namespace: ex267-t08-evaluation
data:
  quantize.py: |-
    import hashlib
    import json
    from pathlib import Path
    import numpy as np

    output_dir = Path("/results")
    rng = np.random.default_rng(267)
    weights = rng.normal(0, 0.2, size=(1024, 1024)).astype(np.float32)
    scale = float(np.max(np.abs(weights)) / 127.0)
    quantized = np.clip(np.rint(weights / scale), -127, 127).astype(np.int8)
    target = output_dir / "weights-int8.npy"
    np.save(target, quantized)
    digest = hashlib.sha256(target.read_bytes()).hexdigest()
    report = {"method": "symmetric-int8", "sha256": digest, "bytes": target.stat().st_size}
    (output_dir / "report.json").write_text(json.dumps(report, indent=2) + "\n")
    print(json.dumps(report))
---
