apiVersion: batch/v1
kind: Job
metadata:
  name: quantize-support-llm
  namespace: ex267-t08-evaluation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: quantize
          image: registry.access.redhat.com/ubi9/python-312:9.6
          command: [/bin/sh, -c]
          args:
            - python -m pip install --no-cache-dir numpy==2.2.6 && python /opt/ex267/quantize.py
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: script
              mountPath: /opt/ex267
              readOnly: true
            - name: results
              mountPath: /results
      volumes:
        - name: script
          configMap:
            name: quantization-script
        - name: results
          persistentVolumeClaim:
            claimName: quantization-results

