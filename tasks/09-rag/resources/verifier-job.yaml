apiVersion: batch/v1
kind: Job
metadata:
  name: rag-contract-verification
  namespace: ex267-t09-rag
  labels:
    ex267.practice/task: "09"
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: rag-contract-verification
    spec:
      restartPolicy: Never
      containers:
        - name: verifier
          image: registry.access.redhat.com/ubi9/python-312:9.6
          command: [python, /verify/verify_rag.py]
          env:
            - name: BASE_URL
              value: http://genai-app:8080
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          volumeMounts:
            - name: verifier
              mountPath: /verify
              readOnly: true
      volumes:
        - name: verifier
          configMap:
            name: exam-provided-rag-verifier
