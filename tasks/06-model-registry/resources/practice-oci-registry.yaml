apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-oci-registry
  namespace: ex267-t06-registry
  labels:
    app: practice-oci-registry
    ex267.practice/input: "true"
    ex267.practice/task: "06"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: practice-oci-registry
  template:
    metadata:
      labels:
        app: practice-oci-registry
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          env:
            - {name: REGISTRY_AUTH, value: htpasswd}
            - {name: REGISTRY_AUTH_HTPASSWD_REALM, value: AI267 Practice Registry}
            - {name: REGISTRY_AUTH_HTPASSWD_PATH, value: /auth/htpasswd}
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          ports:
            - {name: registry, containerPort: 5000}
          readinessProbe:
            tcpSocket: {port: registry}
            periodSeconds: 3
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          volumeMounts:
            - {name: auth, mountPath: /auth, readOnly: true}
            - {name: data, mountPath: /var/lib/registry}
      volumes:
        - name: auth
          secret:
            secretName: exam-provided-oci-auth
        - name: data
          persistentVolumeClaim:
            claimName: practice-oci-registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: practice-oci-registry
  namespace: ex267-t06-registry
  labels:
    ex267.practice/input: "true"
    ex267.practice/task: "06"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: practice-oci-registry
  namespace: ex267-t06-registry
  labels:
    ex267.practice/input: "true"
    ex267.practice/task: "06"
spec:
  selector: {app: practice-oci-registry}
  ports:
    - {name: registry, port: 5000, targetPort: registry}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: practice-oci-registry
  namespace: ex267-t06-registry
  labels:
    ex267.practice/input: "true"
    ex267.practice/task: "06"
spec:
  to: {kind: Service, name: practice-oci-registry}
  port: {targetPort: registry}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
