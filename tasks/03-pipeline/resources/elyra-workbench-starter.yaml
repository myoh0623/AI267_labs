apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipelines-elyra-wb
  namespace: ex267-t03-pipeline
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: pipelines-elyra-wb
  namespace: ex267-t03-pipeline
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Pipelines Elyra Workbench
spec:
  template:
    spec:
      serviceAccountName: pipeline-runner
      containers:
        - name: pipelines-elyra-wb
          image: REPLACE_WITH_STANDARD_DATA_SCIENCE_IMAGE
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: pipelines-elyra-wb
