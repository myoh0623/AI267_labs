apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
kind: DataSciencePipelinesApplication
metadata:
  name: dspa
  namespace: ex267-t03-pipeline
spec:
  dspVersion: v2
  apiServer:
    deploy: true
    enableOauth: true
    enableSamplePipeline: false
    pipelineStore: kubernetes
    cacheEnabled: true
  objectStorage:
    externalStorage:
      bucket: REPLACE_ME
      host: REPLACE_ME
      port: "443"
      scheme: https
      secure: true
      region: us-east-1
      basePath: runs
      s3CredentialsSecret:
        secretName: aws-connection-fraud-s3
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
  database:
    mariaDB:
      deploy: true
      pipelineDBName: mlpipeline
      username: mlpipeline
      passwordSecret:
        name: REPLACE_ME
        key: password
      pvcSize: 1Gi
  mlmd:
    deploy: true
  persistenceAgent:
    deploy: true
  scheduledWorkflow:
    deploy: true
  workflowController:
    deploy: true

