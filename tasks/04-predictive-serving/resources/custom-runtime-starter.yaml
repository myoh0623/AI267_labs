apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: fraud-custom-runtime
  namespace: ex267-t04-serving
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Fraud Custom MLServer
    opendatahub.io/apiProtocol: REST
    opendatahub.io/runtime-version: v1.0
spec:
  annotations:
    prometheus.kserve.io/path: /metrics
    prometheus.kserve.io/port: "8080"
  containers:
    - name: kserve-container
      image: REPLACE_WITH_APPROVED_IMAGE_AT_SHA256_DIGEST
      env:
        - name: MLSERVER_HTTP_PORT
          value: "8080"
        - name: MLSERVER_GRPC_PORT
          value: "9000"
        - name: MODELS_DIR
          value: /mnt/models
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        privileged: false
        runAsNonRoot: true
  multiModel: false
  protocolVersions: [v2]
  supportedModelFormats:
    - name: sklearn
      version: "0"
      autoSelect: true
      priority: 2
    - name: sklearn
      version: "1"
      autoSelect: true
      priority: 2

