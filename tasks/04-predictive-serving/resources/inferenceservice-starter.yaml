apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-v2
  namespace: ex267-t04-serving
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    opendatahub.io/connections: fraud-s3
    opendatahub.io/connection-path: models/fraud/2/
    ex267.io/model-sha256: REPLACE_ME
spec:
  predictor:
    minReplicas: 1
    model:
      modelFormat:
        name: onnx
        version: "1"
      runtime: REPLACE_WITH_OPENVINO_RUNTIME
      resources:
        requests:
          cpu: REPLACE_ME
          memory: REPLACE_ME
        limits:
          cpu: REPLACE_ME
          memory: REPLACE_ME

