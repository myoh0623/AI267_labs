apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: custom-workbench
  namespace: ex267-t02-workbench
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: custom-workbench
  namespace: ex267-t02-workbench
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
      from:
        kind: ImageStreamTag
        namespace: redhat-ods-applications
        name: jupyter-minimal-cpu-py312-ubi9:v3.3.0
  output:
    to:
      kind: ImageStreamTag
      name: custom-workbench:1.0
  triggers: []
