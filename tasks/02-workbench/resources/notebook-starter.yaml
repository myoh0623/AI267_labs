apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: risk-lab
  namespace: ex267-t02-workbench
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Risk Lab
spec:
  template:
    spec:
      serviceAccountName: risk-lab
      containers:
        - name: risk-lab
          image: REPLACE_WITH_APPROVED_IMAGE_DIGEST
          workingDir: /opt/app-root/src
          resources:
            requests:
              cpu: REPLACE_ME
              memory: REPLACE_ME
            limits:
              cpu: REPLACE_ME
              memory: REPLACE_ME
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: risk-lab-storage

