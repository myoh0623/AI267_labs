apiVersion: v1
kind: Namespace
metadata:
  name: ex267-t02-workbench
  labels:
    ex267.practice/managed: "true"
    ex267.practice/task: "02"
    opendatahub.io/dashboard: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: risk-lab-storage
  namespace: ex267-t02-workbench
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: risk-lab
  namespace: ex267-t02-workbench
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: git-experiments-storage
  namespace: ex267-t02-workbench
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-experiments
  namespace: ex267-t02-workbench
---
apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: git-experiments
  namespace: ex267-t02-workbench
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Git Experiments
spec:
  template:
    spec:
      serviceAccountName: git-experiments
      containers:
        - name: git-experiments
          image: registry.redhat.io/rhoai/odh-workbench-jupyter-minimal-cpu-py312-rhel9@sha256:44c8c2789b1773d6a66d68eac85262ac173989f99ae5bc0ea8c192bd1504d3f2
          workingDir: /opt/app-root/src
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: git-experiments-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workbench-contract
  namespace: ex267-t02-workbench
data:
  workbench_name: risk-lab
  approved_image: registry.redhat.io/rhoai/odh-workbench-jupyter-minimal-cpu-py312-rhel9@sha256:44c8c2789b1773d6a66d68eac85262ac173989f99ae5bc0ea8c192bd1504d3f2
  mount_path: /opt/app-root/src
  storage: 10Gi
  custom_image_name: custom-workbench
  custom_image_tag: "1.0"
  custom_package_1: seaborn==0.12.2
  custom_package_2: python-json-logger==2.0.7
  git_repository: https://github.com/RedHatTraining/AI26X-apps
  git_branch: RHOAI3.3
